[project]
name = "afinni"
version = "0.1.0"
description = "AFINNI: Adaptive affine nearest neighbor interpolation"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
# license = "MIT" # TODO

# Core = the CPU-only install. Must have wheels on Linux, macOS and Windows.
dependencies = [
    "array-api-compat>=1.12.0",
    "diffrax>=0.7.2",
    "faiss-cpu>=1.12.0",
    "jax>=0.7.0",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "psutil>=6.0.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
]

# [project.urls]
# "Homepage" = "TODO"
# "Bug Reports" = "TODO"
# "Source" = "TODO"

# Optional runtime backends. Combine freely, e.g. `uv sync --extra gpu --extra mpi`.
# Backend detection & fallbacks live in src/backend.py (`uv run python -m src`).
[project.optional-dependencies]
# MPI for local machines: mpi4py + an MPI runtime shipped as a wheel (no system MPI needed).
mpi = [
    "mpi4py>=4.1.1",
    "mpich>=4.3.0 ; sys_platform != 'win32'",
    "impi-rt>=2021.14.0 ; sys_platform == 'win32'",
]
# MPI for HPC / user-managed MPI: mpi4py only, binds to the system MPI at runtime
# (e.g. `module load impi`). Never combine with `mpi` - its bundled runtime would
# shadow the cluster's MPI.
mpi-system = [
    "mpi4py>=4.1.1",
]
# NVIDIA GPU, CUDA 12. CUDA libraries come from pip ([ctk]); only a driver is required.
# cuML is Linux-only: on Windows the code falls back to scikit-learn / FAISS for
# KMeans / kNN. macOS has no CUDA, so this extra installs nothing there.
gpu = [
    "cupy-cuda12x[ctk]>=13.6.0 ; sys_platform != 'darwin'",
    "cuml-cu12>=25.10.0 ; sys_platform == 'linux'",
    "nvidia-ml-py>=12.535.0 ; sys_platform != 'darwin'",
]

[tool.uv]
# `uv lock` fails if any locked package lacks a wheel for one of these platforms.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

[tool.uv.sources]
knndbscan = { index = "testpypi" }

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "PIE", "T20", "UP", "NPY", "SIM"]
ignore = [
    "E501", # Line too long (handled by formatter)
    "N803", # Allow non-standard naming (e.g., single-letter variables) in some contexts
    "N806", # Allow mathematical variable names (e.g., N, A, JA, minPts) in some contexts
    "T201", # Allow print statements in examples
]

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["T201", "N803", "N806"]  # Allow print statements and non-standard naming in examples
"test/*.py" = ["N806"]  # Allow mathematical variable names in tests (N, A, JA, minPts)
"*.pyi" = ["N803"]  # Allow non-standard naming in type stubs

[tool.pytest.ini_options]
addopts = [
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
markers = [
    "mpi: launches a multi-rank job via mpiexec (skipped unless MPI is available; deselect with -m 'not mpi')",
]

# Developer tooling (never part of a runtime install). `dev` is installed by
# default by `uv sync`; pass `--no-dev` for a runtime-only environment.
[dependency-groups]
lint = [
    "ruff>=0.14.2",
]
test = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "sympy>=1.14.0",
]
notebook = [
    "ipykernel>=7.1.0",
    "ipympl>=0.10.0",
    "nbformat>=5.10.4",
]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "notebook" },
]
# Extra packages used by scripts under research/ (not needed by src/).
research = [
    "knndbscan==0.1.3 ; sys_platform == 'linux'",
    "numba>=0.61.2",
    "optuna>=4.7.0",
    "sympy>=1.14.0",
]
viz = [
    "imageio>=2.37.2",
    "manim>=0.19.2",
    "plotly>=6.5.2",
]
